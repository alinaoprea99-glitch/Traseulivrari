<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Urmărește livrarea — Crăița Merelor</title>
<meta name="theme-color" content="#2D6A4F">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
:root{
  --paper: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #FBF9F5;
  --ink: #1A2B2E;
  --ink-soft: #5B6B6D;
  --ink-faint: #8B9A9B;
  --line: #E4DFD3;

  --route: #FF5A1F;
  --route-soft: #FFE4D6;
  --route-ring: rgba(255,90,31,0.22);

  --ok: #2D6A4F;
  --ok-soft: #DCEEE3;
  --bad: #C23B22;
  --bad-soft: #FBE4DF;

  --shadow-1: 0 1px 2px rgba(26,43,46,0.06), 0 1px 1px rgba(26,43,46,0.04);
  --shadow-2: 0 8px 24px rgba(26,43,46,0.10), 0 2px 6px rgba(26,43,46,0.06);
  --shadow-glow: 0 10px 30px rgba(255,90,31,0.16), 0 2px 8px rgba(26,43,46,0.06);

  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 11px;
  --radius-pill: 999px;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper: #10181A;
    --surface: #182226;
    --surface-2: #1D282B;
    --ink: #F2F1EC;
    --ink-soft: #9FB0AF;
    --ink-faint: #647574;
    --line: #26333368;

    --route: #FF7A47;
    --route-soft: #3A2318;
    --route-ring: rgba(255,122,71,0.28);

    --ok: #56C596;
    --ok-soft: #16302489;
    --bad: #FF6E56;
    --bad-soft: #3A1C1689;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
    --shadow-2: 0 8px 28px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    --shadow-glow: 0 10px 32px rgba(255,122,71,0.20), 0 2px 10px rgba(0,0,0,0.35);
  }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:32px;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ---- map: sticky at the top, info panel scrolls underneath — one page, no tabs ---- */
#mapWrap{
  display:none;
  position:sticky; top:0; z-index:10;
  width:100%; height:40vh; min-height:220px;
  background:var(--surface-2);
  box-shadow:var(--shadow-2);
}
#trackMap{ width:100%; height:100%; }

.me-dot{
  width:18px; height:18px; border-radius:50%;
  background:#3B82F6; border:3px solid var(--surface);
  box-shadow:0 0 0 2px #3B82F6, 0 2px 8px rgba(0,0,0,0.35);
}
.home-pin{
  width:30px; height:30px; border-radius:50% 50% 50% 0;
  background:var(--route); transform:rotate(-45deg);
  border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.35);
}

.content{ padding:16px 16px 0; max-width:520px; margin:0 auto; }

.status-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:var(--shadow-glow);
  border:1px solid color-mix(in srgb, var(--route) 22%, transparent);
  margin-top:-34px; position:relative; z-index:11;
  text-align:center;
}
.status-card.done{ border-color:color-mix(in srgb, var(--ok) 30%, transparent); }
.status-card.failed{ border-color:color-mix(in srgb, var(--bad) 30%, transparent); }
.status-icon{ width:40px; height:40px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
.status-icon svg{ width:22px; height:22px; }
.status-icon.pending{ background:var(--route-soft); color:var(--route); }
.status-icon.done{ background:var(--ok-soft); color:var(--ok); }
.status-icon.failed{ background:var(--bad-soft); color:var(--bad); }
.status-title{ font-size:17px; font-weight:750; letter-spacing:-0.01em; }
.status-sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
.status-updated{ font-size:11px; color:var(--ink-faint); margin-top:8px; }

.card{
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:16px;
  margin-top:14px;
  box-shadow:var(--shadow-1);
}
.card-title{ font-size:11.5px; font-weight:700; letter-spacing:.05em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px; }
.order-name{ font-size:16px; font-weight:700; }
.order-addr{ font-size:13.5px; color:var(--ink-soft); margin-top:2px; }
.details-line{ display:flex; align-items:flex-start; gap:5px; font-size:12.5px; color:var(--ink-faint); margin-top:4px; }
.details-line svg{ width:13px; height:13px; flex-shrink:0; margin-top:1px; }

.chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip{
  display:inline-flex; align-items:center; gap:4px;
  font-size:11.5px; font-weight:650; padding:5px 10px;
  border-radius:var(--radius-pill); font-variant-numeric:tabular-nums;
}
.chip svg{ width:12px; height:12px; }
.chip.time{ background:var(--ok-soft); color:var(--ok); }
.chip.cash{ background:var(--route-soft); color:color-mix(in srgb, var(--route) 75%, black 20%); }
.chip.products{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }

.confirm-btn{
  width:100%; border:none; cursor:pointer;
  padding:13px 0; border-radius:var(--radius-md);
  background:var(--ok-soft); color:var(--ok);
  font-weight:700; font-size:14.5px; font-family:inherit;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, background .25s ease, color .25s ease, box-shadow .25s ease;
}
.confirm-btn svg{ width:17px; height:17px; }
.confirm-btn:active{ transform:scale(0.97); }
.confirm-btn.active{ background:var(--ok); color:#fff; box-shadow:0 6px 16px rgba(45,106,79,0.28); }

.note-editor{ margin-top:12px; }
.note-label{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:650; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.02em; margin-bottom:5px; }
.note-label svg{ width:12px; height:12px; }
.note-input{
  display:block; width:100%; box-sizing:border-box; resize:vertical;
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface-2); color:var(--ink);
  font-family:inherit; font-size:13px; line-height:1.4; padding:9px 11px;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.note-input::placeholder{ color:var(--ink-faint); }
.note-input:focus{ outline:none; border-color:var(--route); box-shadow:0 0 0 3px var(--route-ring); background:var(--surface); }
.note-saved{ font-size:11px; color:var(--ok); margin-top:5px; height:14px; opacity:0; transition:opacity .3s ease; }
.note-saved.show{ opacity:1; }

.foot-note{ text-align:center; font-size:11.5px; color:var(--ink-faint); padding:18px 16px 4px; }

.empty-state{ text-align:center; padding:90px 24px; }
.empty-state .es-icon svg{ width:36px; height:36px; color:var(--ink-faint); }
.empty-state .es-title{ font-weight:700; font-size:16px; margin-top:12px; }
.empty-state .es-sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
</style>
</head>
<body>
<div id="mapWrap"><div id="trackMap"></div></div>
<div id="root"></div>
<script src="tracking.js"></script>
</body>
</html>
