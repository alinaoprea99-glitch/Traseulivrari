<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Istoricul comenzilor — Crăița Merelor</title>
<meta name="theme-color" content="#2D6A4F">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
:root{
  --paper: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #FBF9F5;
  --ink: #1A2B2E;
  --ink-soft: #5B6B6D;
  --ink-faint: #8B9A9B;
  --line: #E4DFD3;

  --route: #FF5A1F;
  --route-soft: #FFE4D6;

  --ok: #2D6A4F;
  --ok-soft: #DCEEE3;
  --bad: #C23B22;
  --bad-soft: #FBE4DF;

  --shadow-1: 0 1px 2px rgba(26,43,46,0.06), 0 1px 1px rgba(26,43,46,0.04);

  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 11px;
  --radius-pill: 999px;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper: #10181A;
    --surface: #182226;
    --surface-2: #1D282B;
    --ink: #F2F1EC;
    --ink-soft: #9FB0AF;
    --ink-faint: #647574;
    --line: #26333368;

    --route: #FF7A47;
    --route-soft: #3A2318;

    --ok: #56C596;
    --ok-soft: #16302489;
    --bad: #FF6E56;
    --bad-soft: #3A1C1689;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
  }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:32px;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

.head{
  padding:22px 18px 16px;
  border-bottom:1px solid var(--line);
}
.head-title{ font-size:20px; font-weight:750; letter-spacing:-0.02em; }
.head-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }

.content{ padding:16px 16px 0; max-width:520px; margin:0 auto; }

.order-card{
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:14px 15px;
  margin-bottom:10px;
  box-shadow:var(--shadow-1);
}
.order-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.order-date{ font-size:13.5px; font-weight:700; }
.order-badge{
  font-size:11px; font-weight:700; padding:3px 9px;
  border-radius:var(--radius-pill); white-space:nowrap;
}
.order-badge.pending{ color:var(--route); background:var(--route-soft); }
.order-badge.delivered{ color:var(--ok); background:var(--ok-soft); }
.order-badge.failed{ color:var(--bad); background:var(--bad-soft); }

.order-products{ font-size:13px; color:var(--ink-soft); margin-top:8px; }
.order-meta{ font-size:12px; color:var(--ink-faint); margin-top:6px; font-variant-numeric:tabular-nums; }

.empty-state{ text-align:center; padding:90px 24px; }
.empty-state .es-icon svg{ width:36px; height:36px; color:var(--ink-faint); }
.empty-state .es-title{ font-weight:700; font-size:16px; margin-top:12px; }
.empty-state .es-sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; }

.foot-note{ text-align:center; font-size:11.5px; color:var(--ink-faint); padding:18px 16px 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="istoric.js"></script>
</body>
</html>
